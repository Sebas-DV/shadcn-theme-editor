name: Release

# Publishes all packages to npm with build provenance (a signed attestation of
# how/where they were built). Trigger by pushing a version tag, e.g.:
#   git tag v0.1.3 && git push origin v0.1.3
# or run manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# id-token is required for npm provenance (OIDC).
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Publish with provenance
        run: >
          pnpm -r --filter "./packages/**" --filter "./cli"
          publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
